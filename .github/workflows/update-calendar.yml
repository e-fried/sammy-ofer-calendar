name: Update and publish calendar

on:
  push:
    branches: [main]
    paths-ignore:
      - '.calendar-state/**'
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: calendar-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify calendar behavior
        run: python -m unittest discover -s tests -v
      - name: Refresh fixtures and static calendar
        run: python update_calendar.py
      - name: Preserve event revisions for the next run
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .calendar-state/fixtures.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public fixture revision state"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish calendar
        id: deploy
        uses: actions/deploy-pages@v5
